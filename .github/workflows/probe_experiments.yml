name: Run Probe Experiments

on:
  workflow_dispatch:
    inputs:
      case:
        description: "PDE case to run"
        required: true
        type: choice
        options:
          - allen_cahn
          - heat_equation
          - wave_equation
          - kdv_soliton
          - nls_soliton
          - kdv_double_soliton
          - all_6

jobs:
  probe_experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    strategy:
      matrix:
        case: ${{ inputs.case == 'all_6' && fromJson('["allen_cahn", "heat_equation", "wave_equation", "kdv_soliton", "nls_soliton", "kdv_double_soliton"]') || fromJson(format('["{0}"]', inputs.case)) }}
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy matplotlib pandas

      - name: Run probe experiments
        run: |
          python -m minimal_pinn.run_multiseed_probe --spec minimal_pinn/configs/probe_keypoints_v2_${{ matrix.case }}.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: probe_${{ matrix.case }}
          path: minimal_pinn/results/probes/keypoints_v2_${{ matrix.case }}/
          retention-days: 90
