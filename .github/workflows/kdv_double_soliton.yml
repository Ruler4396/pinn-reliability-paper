name: KdV Double Soliton - Protocol B

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        type: choice
        options:
          - run_all
          - run_batch1
          - run_batch2
          - merge

jobs:
  run-batch1:
    if: inputs.action == 'run_all' || inputs.action == 'run_batch1'
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install matplotlib pandas numpy
      - name: Run KdV double soliton batch 1 (high obs)
        run: python -m minimal_pinn.run_matrix --spec minimal_pinn/configs/matrix_protocol_b_kdv_double_batch1.json
        env:
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol_b_matrix_kdv_double_batch1
          path: minimal_pinn/results/matrices/protocol_b_kdv_double_batch1/
          retention-days: 90

  run-batch2:
    if: inputs.action == 'run_all' || inputs.action == 'run_batch2'
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install matplotlib pandas numpy
      - name: Run KdV double soliton batch 2 (low obs)
        run: python -m minimal_pinn.run_matrix --spec minimal_pinn/configs/matrix_protocol_b_kdv_double_batch2.json
        env:
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol_b_matrix_kdv_double_batch2
          path: minimal_pinn/results/matrices/protocol_b_kdv_double_batch2/
          retention-days: 90

  merge:
    if: inputs.action == 'merge'
    runs-on: ubuntu-latest
    needs: []
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download artifacts
        run: |
          mkdir -p downloaded
          for name in protocol_b_matrix_kdv_double_batch1 protocol_b_matrix_kdv_double_batch2; do
            echo "Downloading $name..."
            gh run download --name "$name" --dir "downloaded/$name" --repo ${{ github.repository }} 2>&1 || echo "  (not found, skipping)"
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Merge summary CSVs
        run: |
          python -c "
          import csv, pathlib
          all_rows = []
          for p in sorted(pathlib.Path('downloaded').rglob('matrix_summary.csv')):
              rows = list(csv.DictReader(open(p, encoding='utf-8')))
              all_rows.extend(rows)
              print(f'  {p}: {len(rows)} rows')
          if all_rows:
              fields = list(all_rows[0].keys())
              out = pathlib.Path('kdv_double_merged_summary.csv')
              with out.open('w', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields)
                  w.writeheader()
                  w.writerows(all_rows)
              print(f'Merged {len(all_rows)} rows total')
          else:
              print('No rows found')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: kdv_double_merged
          path: kdv_double_merged_summary.csv
          retention-days: 90
