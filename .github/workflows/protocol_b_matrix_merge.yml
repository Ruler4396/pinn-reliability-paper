name: Protocol B Matrix Merge

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: minimal_pinn/results/matrices/
          pattern: protocol_b_matrix_*
      - name: Merge summary CSVs
        run: |
          python -c "
          import csv, pathlib
          all_rows = []
          for p in sorted(pathlib.Path('minimal_pinn/results/matrices').rglob('matrix_summary.csv')):
              rows = list(csv.DictReader(open(p, encoding='utf-8')))
              all_rows.extend(rows)
          if all_rows:
              fields = list(all_rows[0].keys())
              out = pathlib.Path('minimal_pinn/results/matrices/protocol_b_merged_summary.csv')
              with out.open('w', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields)
                  w.writeheader()
                  w.writerows(all_rows)
              print(f'Merged {len(all_rows)} rows')
          else:
              print('No rows found')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: protocol_b_merged
          path: minimal_pinn/results/matrices/protocol_b_merged_summary.csv
          retention-days: 90
