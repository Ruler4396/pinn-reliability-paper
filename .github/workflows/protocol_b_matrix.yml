name: Protocol B Degradation Matrix

on:
  workflow_dispatch:
    inputs:
      case:
        description: 'PDE case to run (or "merge" to combine results)'
        required: true
        type: choice
        options:
          - kdv_batch1
          - kdv_batch2
          - nls
          - wave
          - merge

jobs:
  matrix:
    if: inputs.case != 'merge'
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install matplotlib pandas numpy
      - name: Run degradation matrix for ${{ inputs.case }}
        run: python -m minimal_pinn.run_matrix --spec minimal_pinn/configs/matrix_protocol_b_${{ inputs.case }}.json
        env:
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol_b_matrix_${{ inputs.case }}
          path: minimal_pinn/results/matrices/protocol_b_${{ inputs.case }}/
          retention-days: 90

  merge:
    if: inputs.case == 'merge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download all matrix artifacts via API
        run: |
          python -c "
          import urllib.request, json, zipfile, io, os
          token = '${{ github.token }}'
          repo = '${{ github.repository }}'
          headers = {'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json'}

          # Find all completed workflow runs
          url = f'https://api.github.com/repos/{repo}/actions/workflows/protocol_b_matrix.yml/runs?per_page=20&status=completed'
          req = urllib.request.Request(url, headers=headers)
          resp = urllib.request.urlopen(req, timeout=15)
          runs = json.load(resp)['workflow_runs']

          os.makedirs('downloaded', exist_ok=True)
          count = 0
          for run in runs:
              art_url = run['artifacts_url']
              req2 = urllib.request.Request(art_url, headers=headers)
              resp2 = urllib.request.urlopen(req2, timeout=15)
              for art in json.load(resp2)['artifacts']:
                  if art['name'].startswith('protocol_b_matrix_') and not art['expired']:
                      dl_url = art['archive_download_url']
                      req3 = urllib.request.Request(dl_url, headers=headers)
                      resp3 = urllib.request.urlopen(req3, timeout=60)
                      zf = zipfile.ZipFile(io.BytesIO(resp3.read()))
                      dest = os.path.join('downloaded', art['name'])
                      os.makedirs(dest, exist_ok=True)
                      zf.extractall(dest)
                      count += 1
                      print(f'Downloaded: {art[\"name\"]} ({art[\"size_in_bytes\"]//1024}KB)')
          print(f'Total artifacts downloaded: {count}')
          "
      - name: Merge summary CSVs
        run: |
          python -c "
          import csv, pathlib
          all_rows = []
          for p in sorted(pathlib.Path('downloaded').rglob('matrix_summary.csv')):
              rows = list(csv.DictReader(open(p, encoding='utf-8')))
              all_rows.extend(rows)
              print(f'  {p}: {len(rows)} rows')
          if all_rows:
              fields = list(all_rows[0].keys())
              out = pathlib.Path('protocol_b_merged_summary.csv')
              with out.open('w', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields)
                  w.writeheader()
                  w.writerows(all_rows)
              print(f'Merged {len(all_rows)} rows total')
          else:
              print('No rows found')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: protocol_b_merged
          path: protocol_b_merged_summary.csv
          retention-days: 90
