name: Protocol B Degradation Matrix

on:
  workflow_dispatch:
    inputs:
      case:
        description: 'PDE case to run'
        required: true
        type: choice
        options:
          - kdv
          - nls
          - wave

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install matplotlib pandas numpy
      - name: Run degradation matrix for ${{ inputs.case }}
        run: python -m minimal_pinn.run_matrix --spec minimal_pinn/configs/matrix_protocol_b_${{ inputs.case }}.json
        env:
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol_b_matrix_${{ inputs.case }}
          path: minimal_pinn/results/matrices/protocol_b_${{ inputs.case }}/
          retention-days: 90
